name: Tests and deploy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-test-key
      DEBUG: "True"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest --no-migrations

  deploy:
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_PASSPHRASE }}
          command_timeout: 30m  
          script: |
            set -e

            # Navigate to the project directory
            cd /home/etb/efir

            # Generate timestamp for the backup filename
            TIMESTAMP=$(date +"%Y-%m-%d_%H-%M")
            BACKUP_FILE="./backups/db_backup_${TIMESTAMP}.json"

            echo "Creating database backup to ${BACKUP_FILE}..."

            # Execute dumpdata inside the running 'app' container
            docker compose exec -T app python ./efir/manage.py dumpdata \
              --exclude auth.permission \
              --exclude contenttypes \
              --format=json > "${BACKUP_FILE}"

            echo "Backup successfully created."

            # Pull the latest code from the repository
            git pull origin ${{ github.ref_name }}

            # Rebuild and restart Docker containers
            docker compose down
            docker compose up -d --build

            # Clean up unused Docker images and cache
            docker image prune -f
